version: 2

updates:
  # ---------------------------------------------------------------------------
  # Monorepo TypeScript. Um unico ecossistema npm cobre a raiz e os workspaces.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps)'
    # Sem agrupamento, uma semana normal abre 15 PRs e ninguem revisa nenhum.
    # Agrupados, viram dois PRs revisaveis.
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    # Major nunca chega por PR automatica. Trocar de major e decisao de
    # arquitetura - exige ler changelog, avaliar breaking changes e, quando for
    # o caso, escrever um ADR. Bumps de major sao feitos a mao, quando decidido.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # ---------------------------------------------------------------------------
  # Backend Java
  # ---------------------------------------------------------------------------
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      spring:
        patterns: ['org.springframework*']
        update-types: [minor, patch]
      demais:
        patterns: ['*']
        exclude-patterns: ['org.springframework*']
        update-types: [minor, patch]
    # Mesma regra do npm, e aqui ela e ainda mais importante: sem este bloco o
    # Dependabot propoe Spring Boot 4.x como se fosse bump de rotina, desfazendo
    # em uma PR agrupada a escolha registrada no commit que adotou a linha 3.5.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # ---------------------------------------------------------------------------
  # As proprias actions do CI. Sao codigo de terceiro rodando com acesso ao
  # repositorio - envelhecem como qualquer outra dependencia.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
