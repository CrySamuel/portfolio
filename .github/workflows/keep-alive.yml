name: keep-alive

# Janela de 10:00 as 01:59 UTC, ou seja 07:00 as 22:59 em Brasilia.
#
# **Quem mantem a cadencia e o laco dentro do script, e nao este cron.** A
# premissa original - "dez minutos cobrem o atraso do GitHub" - estava errada por
# uma ordem de grandeza: medido em seis execucoes, o `*/10` e entregue a cada
# **42 a 57 minutos**, contra a hibernacao de quinze. Cada execucao dava um ping
# so, entao o servico dormia entre uma passagem e a outra e o keep-alive nao
# cumpria o que promete.
#
# Agora cada execucao fica de pe **55 minutos**, pingando a cada cinco. O cron
# continua em `*/10` de proposito: agendamento no plano gratuito e **descartado**
# sob carga, e não enfileirado, entao pedir com frequencia e o que garante que
# alguma tentativa passe. O `concurrency` abaixo faz a execucao nova substituir a
# que estava em laco, o que mantem sempre exatamente uma viva.
#
# Repositorio publico tem minutos de Actions ilimitados, entao o laco nao custa
# cota de CI. O que ele consome e hora de instancia do Render, e por isso o
# script para sozinho ao sair da janela - ver o cabecalho dele para a conta.
#
# Fora da janela o servico dorme, e e isso que mantem o consumo em ~487 das 750
# horas mensais do plano gratuito. Ver o cabecalho de infra/scripts/keep-alive.sh
# para a conta.
#
# Aviso do GitHub: agendamento e desativado automaticamente apos 60 dias sem
# commit no repositorio. Num portfolio em desenvolvimento isso nao acontece, mas
# se o projeto ficar parado, o keep-alive para junto - e o sintoma seria o
# Swagger lento, nao um erro.
on:
  schedule:
    - cron: '*/10 10-23,0-1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    name: manter a api acordada
    runs-on: ubuntu-latest
    # Maior que os 55 minutos do laco, com folga para o cold start do primeiro
    # ping. Menor nao adiantaria: o job seria morto no meio do laco.
    timeout-minutes: 60

    # A variavel e cadastrada em Settings > Secrets and variables > Actions >
    # Variables, com o nome API_BASE_URL e a URL publica do Render. Nao e
    # segredo: o endereco aparece em qualquer requisicao.
    #
    # Sem ela o job e pulado, e nao reprovado. O keep-alive e otimizacao, nao
    # correcao: transformar "ainda nao configurei" em execucao vermelha a cada
    # dez minutos sujaria o historico do repositorio, que aqui e entregavel.
    if: vars.API_BASE_URL != ''

    steps:
      - uses: actions/checkout@v7

      - name: Manter a API acordada por 55 minutos
        run: ./infra/scripts/keep-alive.sh "${{ vars.API_BASE_URL }}" 55
