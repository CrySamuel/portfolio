# Perfil de desenvolvimento. Ativado automaticamente por ./mvnw spring-boot:run
# (configurado no spring-boot-maven-plugin), nunca pelo jar empacotado.

spring:
  # Aponta para o Postgres do docker-compose. Os defaults batem com os do
  # compose, entao `pnpm db:up` seguido de `./mvnw spring-boot:run` funciona sem
  # nenhum .env. O driver e as migracoes entram no commit 16.
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
    username: ${POSTGRES_USER:portfolio}
    password: ${POSTGRES_PASSWORD:portfolio}

portfolio:
  security:
    # Chave fixa de desenvolvimento. Vale so neste perfil, que o jar empacotado
    # nunca carrega - producao continua obrigada a injetar SERVICE_API_KEY.
    #
    # O valor esta em claro porque nao e segredo: qualquer pessoa com este
    # repositorio pode subir a aplicacao e ler o mesmo dado publico do seed. O
    # que precisa ser segredo e a chave de producao, e essa nunca sai do painel
    # do Render e da Vercel.
    service-key: ${SERVICE_API_KEY:chave-local-de-desenvolvimento-nao-use-em-producao}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,configprops,beans,mappings
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.crystofer.portfolio: DEBUG
    org.springframework.web: INFO
