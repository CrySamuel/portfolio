spring:
  application:
    name: portfolio-api

  # Virtual Threads (Java 21). Chamadas bloqueantes deixam de reter threads de
  # plataforma - e o que torna a programacao reativa desnecessaria neste projeto.
  threads:
    virtual:
      enabled: true

  # JMX desabilitado: nao ha consumidor, e o registro custa tempo de startup e
  # memoria - ambos escassos no free tier (ADR-0006).
  jmx:
    enabled: false

  flyway:
    # Explicito porque o default do JVM nao e confiavel entre os dois ambientes
    # deste projeto: o desenvolvimento e Windows e o CI e Ubuntu. O seed tem
    # acentuacao, e ler UTF-8 como CP1252 nao quebra a migracao - grava mojibake
    # no banco, que so aparece na tela do visitante.
    encoding: UTF-8

    # Ja e o default do Flyway 10, e esta escrito assim mesmo: `clean` apaga
    # todos os objetos do schema, e o unico banco onde alguem digitaria isso por
    # engano e o de producao. Default silencioso protege; default declarado
    # tambem informa a intencao a quem le.
    clean-disabled: true

  jpa:
    hibernate:
      # O par natural do Flyway (ADR-0004). O Hibernate confere se as entidades
      # batem com o schema que a migracao criou e recusa o boot se divergirem;
      # nunca altera nada. `update` faria o oposto - deduziria DDL do codigo e
      # aplicaria calado, tornando o banco de producao o resultado acumulado de
      # deploys em vez de algo versionado.
      #
      # A checagem so vale para o que esta mapeado: coluna que existe no banco e
      # nao na entidade passa despercebida. Coluna mapeada que nao existe, nao.
      ddl-auto: validate

    # Sem isso a sessao fica aberta ate a resposta HTTP terminar. Duas
    # consequencias: consulta preguicosa dispara no meio da serializacao, longe
    # de onde o N+1 pode ser lido, e a conexao do pool fica presa durante a
    # renderizacao inteira. Falso por padrao no Spring Boot desde a 2.0 apenas
    # no aviso - o valor efetivo continua true.
    open-in-view: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/plain,text/css,application/javascript
    min-response-size: 1KB

resilience4j:
  circuitbreaker:
    instances:
      github:
        # Dez chamadas na janela e metade de falha para abrir. Com o cache de 6h
        # o volume e baixo, entao uma janela grande demoraria dias para reunir
        # amostra - e o disjuntor so protegeria depois que ja nao importa.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50

        # Um minuto fechado para o GitHub, que e mais que o suficiente para uma
        # instabilidade passageira e menos que o prazo do cache: mesmo com o
        # circuito aberto, o visitante continua vendo o retrato anterior.
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

        # **403, e nao 429.** O GitHub responde 403 quando a cota da hora acaba,
        # e essa e a armadilha que engana implementacao ingenua: sem registrar o
        # 403 como falha, o disjuntor nunca abriria justamente no caso mais
        # provavel de indisponibilidade.
        record-exceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
        register-health-indicator: false

  retry:
    instances:
      github:
        max-attempts: 3
        wait-duration: 500ms
        exponential-backoff-multiplier: 2

        # Repetir 4xx e insistir no erro proprio: requisicao malformada segue
        # malformada na segunda vez, e a unica consequencia e gastar a cota de
        # quem esta sendo chamado. So falha de servidor e de rede e retentada.
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException

  bulkhead:
    instances:
      github:
        # Um retrato ja gasta ate 22 requisicoes sequenciais. O limite existe
        # para que dois reaquecimentos simultaneos nao virem 44 chamadas na
        # mesma janela de cota.
        max-concurrent-calls: 5
        max-wait-duration: 0

management:
  endpoints:
    web:
      exposure:
        # Default seguro. O perfil local amplia; producao nunca herda o inverso.
        #
        # O prometheus entra porque a Definition of Done do MVP 4 exige o estado
        # do circuito e o hit ratio do cache observaveis. Ele nao expoe conteudo
        # nem configuracao - so contadores -, e continua atras da mesma origem.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

      # Liga /actuator/health/liveness e /actuator/health/readiness.
      #
      # E o que permite a sonda da plataforma e o keep-alive baterem num
      # endpoint que **nao toca o banco**. O /actuator/health completo inclui o
      # indicador `db`, que roda uma query de validacao: usado como health
      # check recorrente, acordaria o Postgres gerenciado a cada poucos
      # segundos e anularia o scale-to-zero que o perfil de producao configura
      # o pool para preservar.
      #
      # Fica aqui, e nao so no perfil prod, porque endpoint que existe apenas em
      # producao e endpoint que ninguem consegue exercitar antes de produzir.
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: '@project.name@'
    version: '@project.version@'
    description: '@project.description@'

portfolio:
  security:
    # Chave compartilhada entre o BFF do Next e esta API (ADR-0005).
    #
    # Sem valor padrao, e de proposito: a aplicacao recusa subir sem ela
    # (SecurityConfig). Um default aqui - mesmo obviamente falso - seria pior do
    # que a ausencia, porque producao herdaria uma chave conhecida e continuaria
    # respondendo como se estivesse protegida.
    #
    # Os perfis local e test declaram a propria chave, para que desenvolver e
    # testar nao dependa de variavel de ambiente.
    service-key: ${SERVICE_API_KEY:}

  github:
    # Perfil publico exibido na secao de estatisticas. Tem default porque e
    # conteudo, e nao segredo: o portfolio tem um dono so, e o valor esta no
    # rodape do site desde o commit 15.
    username: ${GITHUB_USERNAME:CrySamuel}

    # **Opcional, e a diferenca que ele faz e de cota.** Sem token sao 60
    # requisicoes por hora por IP - e a instancia do Render compartilha IP de
    # saida; com token, 5.000. Com o cache de 6h o consumo fica em torno de
    # quatro reaquecimentos por dia, entao o token e margem de seguranca.
    #
    # A excecao e o total de contribuicoes: ele so existe no GraphQL, e o
    # GraphQL do GitHub exige autenticacao. Sem token esse numero e zero, e a
    # secao simplesmente nao mostra a linha.
    token: ${GITHUB_TOKEN:}

    # Quantos repositorios trazer, e de quantos deles somar as linguagens byte a
    # byte. O segundo numero e menor porque cada repositorio custa **uma
    # requisicao a mais**: com 30 e 20, um reaquecimento gasta 22 chamadas -
    # dentro do limite anonimo, com folga para uma segunda tentativa.
    repositories-to-load: 30
    repositories-for-languages: 20

logging:
  level:
    root: INFO
